name: Local web app - Windows ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check, test and package
        run: npm run make
      - name: Checksum local web package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem dist/*-LocalWeb.zip | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-web-${{ github.sha }}
          path: |
            dist/*-LocalWeb.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
